[project]
name = "pymacdns"
version = "0.1.0"
description = "macOS DNS forwarder that respects DHCP-provided upstreams (dns-heaven port)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.0",
  "dnspython>=2.6",
]

[project.scripts]
pymacdns = "pymacdns.__main__:main_sync"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "TID", "UP"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"asyncio.Lock" = { msg = "Use anyio.Lock." }
"asyncio.Event" = { msg = "Use anyio.Event." }
"asyncio.Semaphore" = { msg = "Use anyio.Semaphore." }
"asyncio.Queue" = { msg = "Use anyio memory streams." }
"asyncio.create_task" = { msg = "Use anyio task groups." }
"asyncio.get_event_loop" = { msg = "Use anyio.run or get the running loop." }
